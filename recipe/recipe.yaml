schema_version: 1

context:
  version: "0.1.11"

package:
  name: gmpacket
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gmpacket/gmpacket-${{ version }}.tar.gz
  sha256: 8117a8e8a8fe825aade04fdc000b311de2fb00868f200e362f2e7bae2d25d8a2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - setuptools-scm >=3.4
    - numpy
    - pip
  run:
    - python >=${{ python_min }}
    - geopy >=2.1.0
    - pandas >=1.4.0
    - pydantic >=2.0
    # this is probably wrong, I'll check upstream why it was added
    - setuptools-scm >=6.3.2

tests:
  - python:
      imports:
        - gmpacket
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: ANSS Ground Motion Packet
  license: Unicode-DFS-2016
  license_file: LICENSE.md
  homepage: https://pypi.org/project/gmpacket/

extra:
  recipe-maintainers:
    - ocefpaf
